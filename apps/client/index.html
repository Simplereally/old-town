<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Old Town</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #status-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-family: "Courier New", monospace;
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
      user-select: none;
      border-radius: 4px;
      z-index: 10;
    }
    #status-overlay .disconnected {
      color: #ff4444;
    }
    #status-overlay .connected {
      color: #44ff44;
    }
    #debug-overlay {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #0f0;
      font-family: "Courier New", monospace;
      font-size: 11px;
      line-height: 1.4;
      pointer-events: none;
      user-select: none;
      border-radius: 4px;
      z-index: 10;
      display: none;
    }
    #debug-overlay.visible {
      display: block;
    }
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }
    #ui-container > * {
      pointer-events: auto;
    }
    .ui-panel {
      background: rgba(20, 20, 30, 0.92);
      border: 1px solid #555;
      border-radius: 4px;
      color: #fff;
      font-family: "Courier New", monospace;
      font-size: 12px;
      overflow: hidden;
    }
    .ui-panel-header {
      padding: 6px 10px;
      background: rgba(40, 40, 50, 0.95);
      border-bottom: 1px solid #444;
      font-weight: bold;
      user-select: none;
    }
    .ui-panel-body {
      padding: 8px;
      max-height: 300px;
      overflow-y: auto;
    }
    .ui-panel.hidden {
      display: none;
    }
    #ui-left {
      position: absolute;
      top: 80px;
      left: 8px;
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #ui-right {
      position: absolute;
      top: 80px;
      right: 8px;
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #ui-bottom {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: center;
    }
    #ui-bar {
      position: absolute;
      bottom: 180px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      background: rgba(20, 20, 30, 0.85);
      padding: 4px 8px;
      border-radius: 4px;
      z-index: 30;
    }
    .ui-bar-btn {
      background: rgba(60, 60, 80, 0.8);
      border: 1px solid #444;
      color: #ccc;
      padding: 4px 10px;
      font-family: "Courier New", monospace;
      font-size: 11px;
      cursor: pointer;
      border-radius: 3px;
      user-select: none;
    }
    .ui-bar-btn:hover {
      background: rgba(80, 80, 100, 0.9);
      color: #fff;
    }
    .ui-bar-btn.active {
      background: rgba(100, 100, 130, 0.9);
      color: #fff;
      border-color: #666;
    }

    /* Inventory */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }
    .inventory-cell {
      width: 40px;
      height: 40px;
      background: rgba(40, 40, 50, 0.8);
      border: 1px solid #444;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 2px;
      text-align: center;
    }

    /* Rows */
    .ui-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .ui-row-padded {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .ui-row-thin {
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Text colors */
    .text-muted { color: #aaa; }
    .text-dim { color: #555; }
    .text-bright { color: #fff; }
    .text-system { color: #ffcc00; }

    /* Spellbook */
    .spell-row {
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
    }
    .spell-can-cast { color: #fff; }
    .spell-cannot-cast { color: #555; }

    /* Dialogue */
    .dialogue-option {
      padding: 4px;
      margin-top: 4px;
      background: rgba(60, 60, 80, 0.8);
      cursor: pointer;
      border-radius: 2px;
    }
    .dialogue-option:hover {
      background: rgba(80, 80, 100, 0.9);
    }

    /* Context menu */
    .context-menu {
      position: absolute;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #666;
      border-radius: 4px;
      padding: 4px 0;
      z-index: 1000;
      min-width: 140px;
      font-family: monospace;
      font-size: 12px;
      color: #fff;
      user-select: none;
      cursor: pointer;
    }
    .context-menu-item {
      padding: 4px 12px;
      white-space: nowrap;
    }
    .context-menu-item:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Debug log */
    .debug-log {
      margin-top: 8px;
      border-top: 1px solid #333;
      padding-top: 4px;
      max-height: 200px;
      overflow-y: auto;
    }
    .debug-log-entry {
      font-size: 11px;
      color: #aaa;
    }

    /* Chat */
    .chat-box { width: 600px; }
    .chat-body { max-height: 120px; }
    .chat-input-row {
      display: flex;
      padding: 4px;
      border-top: 1px solid #444;
    }
    .chat-input {
      flex: 1;
      background: rgba(30, 30, 40, 0.9);
      border: 1px solid #444;
      color: #fff;
      padding: 4px 8px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      border-radius: 2px;
    }
    .chat-send-btn {
      margin-left: 4px;
      background: rgba(60, 60, 80, 0.8);
      border: 1px solid #444;
      color: #ccc;
      padding: 4px 8px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      cursor: pointer;
      border-radius: 2px;
    }
    .chat-send-btn:hover {
      background: rgba(80, 80, 100, 0.9);
      color: #fff;
    }

    /* Dialogue box */
    .dialogue-box { width: 400px; margin-bottom: 8px; }
    .dialogue-body { max-height: 150px; }
    .dialogue-text { margin-bottom: 8px; }

    /* Spell target overlay */
    #spell-target-overlay {
      display: none;
      position: absolute;
      bottom: 220px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(80, 0, 0, 0.85);
      border: 1px solid #ff4444;
      color: #ff4444;
      padding: 6px 12px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      z-index: 30;
      pointer-events: none;
    }
    #spell-target-overlay.visible {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="status-overlay">
    <div id="connection-status" class="disconnected">Disconnected</div>
    <div id="tick-status">Tick: -</div>
    <div id="fps-status">FPS: -</div>
  </div>
    <div id="debug-overlay">
    <div id="debug-stats">Debug info</div>
    <div id="debug-log" class="debug-log"></div>
  </div>
  <div id="ui-container">
    <div id="ui-left">
      <div id="inventory-panel" class="ui-panel hidden">
        <div class="ui-panel-header">Inventory</div>
        <div class="ui-panel-body" id="inventory-body"></div>
      </div>
      <div id="equipment-panel" class="ui-panel hidden">
        <div class="ui-panel-header">Equipment</div>
        <div class="ui-panel-body" id="equipment-body"></div>
      </div>
    </div>
    <div id="ui-right">
      <div id="skills-panel" class="ui-panel hidden">
        <div class="ui-panel-header">Skills</div>
        <div class="ui-panel-body" id="skills-body"></div>
      </div>
      <div id="spellbook-panel" class="ui-panel hidden">
        <div class="ui-panel-header">Spellbook</div>
        <div class="ui-panel-body" id="spellbook-body"></div>
      </div>
      <div id="quest-panel" class="ui-panel hidden">
        <div class="ui-panel-header">Quest Journal</div>
        <div class="ui-panel-body" id="quest-body"></div>
      </div>
    </div>
    <div id="ui-bottom">
      <div id="chat-box" class="ui-panel hidden chat-box">
        <div class="ui-panel-header">Chat</div>
        <div class="ui-panel-body chat-body" id="chat-body"></div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" class="chat-input" placeholder="Type message..." />
          <button type="button" id="chat-send" class="chat-send-btn">Send</button>
        </div>
      </div>
      <div id="dialogue-box" class="ui-panel hidden dialogue-box">
        <div class="ui-panel-header" id="dialogue-npc">Dialogue</div>
        <div class="ui-panel-body dialogue-body" id="dialogue-body">
          <div id="dialogue-text" class="dialogue-text"></div>
          <div id="dialogue-options"></div>
        </div>
      </div>
    </div>
    <div id="ui-bar">
      <button type="button" class="ui-bar-btn" id="btn-inventory" data-panel="inventory-panel">Inv</button>
      <button type="button" class="ui-bar-btn" id="btn-equipment" data-panel="equipment-panel">Eq</button>
      <button type="button" class="ui-bar-btn" id="btn-skills" data-panel="skills-panel">Skill</button>
      <button type="button" class="ui-bar-btn" id="btn-spellbook" data-panel="spellbook-panel">Spell</button>
      <button type="button" class="ui-bar-btn" id="btn-quest" data-panel="quest-panel">Quest</button>
      <button type="button" class="ui-bar-btn" id="btn-chat" data-panel="chat-box">Chat</button>
      <button type="button" class="ui-bar-btn" id="btn-debug" data-panel="debug-overlay">Debug</button>
    </div>
    <div id="spell-target-overlay">Select target for spell (Esc to cancel)</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
